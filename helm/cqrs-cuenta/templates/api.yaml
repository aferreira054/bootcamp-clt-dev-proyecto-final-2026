apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cqrs-cuenta.fullname" . }}-api
  labels:
    {{- include "cqrs-cuenta.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "cqrs-cuenta.fullname" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "cqrs-cuenta.fullname" . }}-api
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z {{ include "cqrs-cuenta.fullname" . }}-postgres 5432; do echo esperando a postgres...; sleep 2; done"
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: {{ include "cqrs-cuenta.fullname" . }}-config }
            - secretRef: { name: {{ include "cqrs-cuenta.fullname" . }}-secret }
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          readinessProbe:
            httpGet: { path: {{ .Values.api.readinessProbe.path }}, port: 8080 }
            initialDelaySeconds: {{ .Values.api.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.readinessProbe.periodSeconds }}
          livenessProbe:
            httpGet: { path: {{ .Values.api.livenessProbe.path }}, port: 8080 }
            initialDelaySeconds: {{ .Values.api.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.livenessProbe.periodSeconds }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cqrs-cuenta.fullname" . }}-api
  labels:
    {{- include "cqrs-cuenta.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: {{ include "cqrs-cuenta.fullname" . }}-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
      {{- if eq .Values.api.service.type "NodePort" }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
