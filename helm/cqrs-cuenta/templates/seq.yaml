apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cqrs-cuenta.fullname" . }}-seq-pvc
  labels:
    {{- include "cqrs-cuenta.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ .Values.seq.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cqrs-cuenta.fullname" . }}-seq
  labels:
    {{- include "cqrs-cuenta.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cqrs-cuenta.fullname" . }}-seq
  template:
    metadata:
      labels:
        app: {{ include "cqrs-cuenta.fullname" . }}-seq
    spec:
      containers:
        - name: seq
          image: {{ .Values.seq.image }}
          ports:
            - containerPort: 80
            - containerPort: 5341
          env:
            - name: ACCEPT_EULA
              value: "Y"
            - name: SEQ_FIRSTRUN_NOAUTHENTICATION
              value: "true"
          resources:
            {{- toYaml .Values.seq.resources | nindent 12 }}
          volumeMounts:
            - name: seq-storage
              mountPath: /data
          readinessProbe:
            tcpSocket: { port: 5341 }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: seq-storage
          persistentVolumeClaim:
            claimName: {{ include "cqrs-cuenta.fullname" . }}-seq-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cqrs-cuenta.fullname" . }}-seq
  labels:
    {{- include "cqrs-cuenta.labels" . | nindent 4 }}
spec:
  selector:
    app: {{ include "cqrs-cuenta.fullname" . }}-seq
  ports:
    - name: ingestion
      port: 5341
      targetPort: 5341
    - name: ui
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cqrs-cuenta.fullname" . }}-seq-ui
  labels:
    {{- include "cqrs-cuenta.labels" . | nindent 4 }}
spec:
  type: {{ .Values.seq.service.type }}
  selector:
    app: {{ include "cqrs-cuenta.fullname" . }}-seq
  ports:
    - port: 80
      targetPort: 80
      {{- if eq .Values.seq.service.type "NodePort" }}
      nodePort: {{ .Values.seq.service.nodePort }}
      {{- end }}
