# Sensible: credenciales de la base. Inyectado en los pods con envFrom.
# stringData queda legible en el chart (valores parametrizados por values.yaml / --set);
# Kubernetes lo codifica a base64 al aplicarlo. En un entorno real, estos valores vendrían
# de un secret manager externo (Vault, Sealed Secrets, etc.), no versionados en texto plano.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cqrs-cuenta.fullname" . }}-secret
  labels:
    {{- include "cqrs-cuenta.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.credentials.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.credentials.password | quote }}
  ConnectionStrings__DefaultConnection: {{ include "cqrs-cuenta.connectionString" . | quote }}
