# Service headless: identidad de red estable requerida por el StatefulSet.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "cqrs-cuenta.fullname" . }}-postgres
  labels:
    {{- include "cqrs-cuenta.labels" . | nindent 4 }}
    app: {{ include "cqrs-cuenta.fullname" . }}-postgres
spec:
  clusterIP: None
  selector:
    app: {{ include "cqrs-cuenta.fullname" . }}-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "cqrs-cuenta.fullname" . }}-postgres
  labels:
    {{- include "cqrs-cuenta.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "cqrs-cuenta.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "cqrs-cuenta.fullname" . }}-postgres
  template:
    metadata:
      labels:
        app: {{ include "cqrs-cuenta.fullname" . }}-postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: {{ include "cqrs-cuenta.fullname" . }}-secret, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ include "cqrs-cuenta.fullname" . }}-secret, key: POSTGRES_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: {{ include "cqrs-cuenta.fullname" . }}-config, key: POSTGRES_DB }
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
